appId: com.hussainislive.havideodownloader
productName: HA Premium Video Downloader
copyright: Copyright © 2026 Hussain Ahmed — GNU GPL v3 or later
directories:
  output: release
  buildResources: resources
files:
  - out/**
  - package.json
  - LICENSE
  - THIRD_PARTY_NOTICES.md
  - '!**/*.map'
asar: true
afterPack: scripts/after-pack.mjs
mac:
  extraResources:
    - from: binaries/macos-${arch}
      to: binaries/macos-${arch}
      filter:
        - yt-dlp
        - ffmpeg
    - from: LICENSE
      to: licenses/LICENSE
    - from: THIRD_PARTY_NOTICES.md
      to: licenses/THIRD_PARTY_NOTICES.md
    - from: resources/icon.png
      to: icon.png
  target:
    - target: dmg
  category: public.app-category.video
  hardenedRuntime: false
  identity: null
  icon: resources/icon.png
  artifactName: HA-Premium-Video-Downloader-${version}-mac-${arch}.${ext}
dmg:
  title: HA Premium Video Downloader
  contents:
    - x: 140
      y: 180
    - x: 420
      y: 180
      type: link
      path: /Applications
win:
  extraResources:
    - from: binaries/win
      to: binaries/win
      filter:
        - yt-dlp.exe
        - ffmpeg.exe
    - from: LICENSE
      to: licenses/LICENSE
    - from: THIRD_PARTY_NOTICES.md
      to: licenses/THIRD_PARTY_NOTICES.md
    - from: resources/icon.png
      to: icon.png
  target:
    - target: nsis
  icon: resources/icon.png
  artifactName: HA-Premium-Video-Downloader-${version}-win-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: always
  createStartMenuShortcut: true
  shortcutName: HA Premium Video Downloader
npmRebuild: false
